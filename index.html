<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReapEarth - Synth + Drum Machine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Shared Transport Bar -->
<div class="transport-bar">
    <div class="transport-brand">
        <span class="brand-name">SYNTH &amp; RHYTHM</span>
        <span class="model-name">ReapEarth</span>
    </div>
    <div class="transport-controls">
        <button class="btn btn-play" id="play-btn">▶ PLAY</button>
        <button class="btn btn-stop" id="stop-btn">■ STOP</button>
        <div class="control-group">
            <label>TEMPO</label>
            <input type="range" id="tempo" min="40" max="240" value="128">
            <span id="tempo-display">128</span>
        </div>
        <div class="control-group">
            <label>SWING</label>
            <input type="range" id="swing" min="0" max="100" value="0">
        </div>
    </div>
    <div class="transport-right">
        <button class="btn btn-share" id="copy-url-btn">📋 SHARE</button>
        <span class="copy-feedback" id="copy-feedback"></span>
    </div>
</div>

<!-- TB-303 Synth Section -->
<div class="section synth-section">
    <header class="section-header">
        <div class="section-brand">
            <span class="section-label">BASS LINE</span>
            <span class="section-model">303</span>
        </div>
        <div class="wave-select">
            <button class="wave-btn active" data-wave="sawtooth">SAW</button>
            <button class="wave-btn" data-wave="square">SQR</button>
        </div>
        <div class="section-volume">
            <label>VOL</label>
            <input type="range" id="synth-volume" min="0" max="100" value="75">
        </div>
    </header>

    <div class="synth-controls">
        <div class="knob-group">
            <label>Cutoff</label>
            <input type="range" id="k-cutoff" min="100" max="5000" value="800">
            <span class="knob-val" id="v-cutoff">800</span>
        </div>
        <div class="knob-group">
            <label>Resonance</label>
            <input type="range" id="k-reso" min="0" max="30" step="0.5" value="8">
            <span class="knob-val" id="v-reso">8.0</span>
        </div>
        <div class="knob-group">
            <label>Env Mod</label>
            <input type="range" id="k-envmod" min="0" max="8000" value="3000">
            <span class="knob-val" id="v-envmod">3000</span>
        </div>
        <div class="knob-group">
            <label>Decay</label>
            <input type="range" id="k-decay" min="0.02" max="1.5" step="0.01" value="0.3">
            <span class="knob-val" id="v-decay">0.30</span>
        </div>
        <div class="knob-group">
            <label>Accent</label>
            <input type="range" id="k-accent" min="0" max="100" value="60">
            <span class="knob-val" id="v-accent">60</span>
        </div>
    </div>

    <div class="sequencer synth-sequencer">
        <div class="step-numbers">
            <span class="row-label"></span>
            <span>1</span><span>2</span><span>3</span><span>4</span>
            <span>5</span><span>6</span><span>7</span><span>8</span>
            <span>9</span><span>10</span><span>11</span><span>12</span>
            <span>13</span><span>14</span><span>15</span><span>16</span>
        </div>
        <div class="seq-row" id="note-row">
            <span class="row-label">NOTE</span>
        </div>
        <div class="seq-row" id="pitch-row">
            <span class="row-label">PITCH</span>
        </div>
        <div class="seq-row" id="oct-row">
            <span class="row-label">OCT</span>
        </div>
        <div class="seq-row" id="accent-row">
            <span class="row-label">ACCENT</span>
        </div>
        <div class="seq-row" id="slide-row">
            <span class="row-label">SLIDE</span>
        </div>
    </div>
</div>

<!-- TR-808 Drum Section -->
<div class="section drum-section">
    <header class="section-header">
        <div class="section-brand">
            <span class="section-label">RHYTHM COMPOSER</span>
            <span class="section-model">808</span>
        </div>
        <div class="section-volume">
            <label>VOL</label>
            <input type="range" id="drum-volume" min="0" max="100" value="80">
        </div>
    </header>

    <div class="instrument-controls">
        <div class="inst-control" data-instrument="kick">
            <label>BASS DRUM</label>
            <div class="knobs">
                <div class="drum-knob-group"><span>TONE</span><input type="range" min="0" max="100" value="50" data-param="tone"></div>
                <div class="drum-knob-group"><span>DECAY</span><input type="range" min="0" max="100" value="60" data-param="decay"></div>
            </div>
        </div>
        <div class="inst-control" data-instrument="snare">
            <label>SNARE DRUM</label>
            <div class="knobs">
                <div class="drum-knob-group"><span>TONE</span><input type="range" min="0" max="100" value="50" data-param="tone"></div>
                <div class="drum-knob-group"><span>SNAPPY</span><input type="range" min="0" max="100" value="60" data-param="snappy"></div>
            </div>
        </div>
        <div class="inst-control" data-instrument="clap">
            <label>HAND CLAP</label>
            <div class="knobs">
                <div class="drum-knob-group"><span>DECAY</span><input type="range" min="0" max="100" value="50" data-param="decay"></div>
            </div>
        </div>
        <div class="inst-control" data-instrument="hihat_closed">
            <label>CLOSED HH</label>
            <div class="knobs">
                <div class="drum-knob-group"><span>DECAY</span><input type="range" min="0" max="100" value="30" data-param="decay"></div>
            </div>
        </div>
        <div class="inst-control" data-instrument="hihat_open">
            <label>OPEN HH</label>
            <div class="knobs">
                <div class="drum-knob-group"><span>DECAY</span><input type="range" min="0" max="100" value="60" data-param="decay"></div>
            </div>
        </div>
        <div class="inst-control" data-instrument="cymbal">
            <label>CYMBAL</label>
            <div class="knobs">
                <div class="drum-knob-group"><span>DECAY</span><input type="range" min="0" max="100" value="70" data-param="decay"></div>
            </div>
        </div>
        <div class="inst-control" data-instrument="tom_low">
            <label>LOW TOM</label>
            <div class="knobs">
                <div class="drum-knob-group"><span>TONE</span><input type="range" min="0" max="100" value="30" data-param="tone"></div>
            </div>
        </div>
        <div class="inst-control" data-instrument="tom_mid">
            <label>MID TOM</label>
            <div class="knobs">
                <div class="drum-knob-group"><span>TONE</span><input type="range" min="0" max="100" value="50" data-param="tone"></div>
            </div>
        </div>
        <div class="inst-control" data-instrument="tom_hi">
            <label>HI TOM</label>
            <div class="knobs">
                <div class="drum-knob-group"><span>TONE</span><input type="range" min="0" max="100" value="70" data-param="tone"></div>
            </div>
        </div>
    </div>

    <div class="sequencer drum-sequencer">
        <div class="step-numbers">
            <div class="instrument-label"></div>
            <div class="steps-row numbers">
                <span>1</span><span>2</span><span>3</span><span>4</span>
                <span>5</span><span>6</span><span>7</span><span>8</span>
                <span>9</span><span>10</span><span>11</span><span>12</span>
                <span>13</span><span>14</span><span>15</span><span>16</span>
            </div>
        </div>
        <div class="track" data-instrument="kick"><div class="instrument-label">BD</div><div class="steps-row"></div></div>
        <div class="track" data-instrument="snare"><div class="instrument-label">SD</div><div class="steps-row"></div></div>
        <div class="track" data-instrument="clap"><div class="instrument-label">CP</div><div class="steps-row"></div></div>
        <div class="track" data-instrument="rim"><div class="instrument-label">RS</div><div class="steps-row"></div></div>
        <div class="track" data-instrument="tom_low"><div class="instrument-label">LT</div><div class="steps-row"></div></div>
        <div class="track" data-instrument="tom_mid"><div class="instrument-label">MT</div><div class="steps-row"></div></div>
        <div class="track" data-instrument="tom_hi"><div class="instrument-label">HT</div><div class="steps-row"></div></div>
        <div class="track" data-instrument="hihat_closed"><div class="instrument-label">CH</div><div class="steps-row"></div></div>
        <div class="track" data-instrument="hihat_open"><div class="instrument-label">OH</div><div class="steps-row"></div></div>
        <div class="track" data-instrument="cymbal"><div class="instrument-label">CY</div><div class="steps-row"></div></div>
        <div class="track" data-instrument="cowbell"><div class="instrument-label">CB</div><div class="steps-row"></div></div>
        <div class="track" data-instrument="conga_hi"><div class="instrument-label">HC</div><div class="steps-row"></div></div>
        <div class="track" data-instrument="conga_mid"><div class="instrument-label">MC</div><div class="steps-row"></div></div>
        <div class="track" data-instrument="conga_low"><div class="instrument-label">LC</div><div class="steps-row"></div></div>
        <div class="track" data-instrument="maracas"><div class="instrument-label">MA</div><div class="steps-row"></div></div>
        <div class="track" data-instrument="claves"><div class="instrument-label">CL</div><div class="steps-row"></div></div>
    </div>

    <div class="pattern-select">
        <label>PATTERN:</label>
        <button class="pattern-btn active" data-pattern="0">A</button>
        <button class="pattern-btn" data-pattern="1">B</button>
        <button class="pattern-btn" data-pattern="2">C</button>
        <button class="pattern-btn" data-pattern="3">D</button>
        <span class="separator">|</span>
        <button class="btn btn-clear" id="clear-btn">CLEAR</button>
    </div>
</div>

<script src="synth-engine.js"></script>
<script src="drum-engine.js"></script>
<script src="transport.js"></script>
<script src="app.js"></script>
</body>
</html>
